version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: afo
      POSTGRES_USER: afo
      POSTGRES_PASSWORD: afo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afo"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://afo:afo@db:5432/afo
    volumes:
      - ./mailbox:/app/mailbox # for the prototype, add a file locally - mounted to docker
    depends_on:
      db:
        condition: service_healthy
  ui:
    build:
      context: ./ui # Build React App
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  postgres_data:
